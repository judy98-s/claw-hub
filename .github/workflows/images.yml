name: 이미지 빌드

# 1GB 서버에서는 Next.js 를 빌드할 수 없다 (1.5GB 넘게 먹는다). 그래서
# 이미지는 여기서 만들어 GHCR 에 올리고, 서버는 받아서 실행만 한다.
# 공개 저장소라 Actions 와 GHCR 모두 무료다.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "빌드 대상 아키텍처"
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # api 이미지 하나에 api·worker·setup 바이너리가 다 들어 있다.
          # entrypoint 만 바꿔서 쓴다.
          - name: api
            context: .
            dockerfile: Dockerfile.api
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        # arm64 를 QEMU 로 빌드할 때만 필요하다. amd64 만이면 건너뛴다.
        if: contains(github.event.inputs.platforms || 'linux/amd64', 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 결과
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
